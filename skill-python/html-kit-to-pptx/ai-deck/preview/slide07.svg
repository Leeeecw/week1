<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#fafafc"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">THREE MODES</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">쓰는 방식은 세 가지로 나뉜다</tspan></text><rect x="88.0" y="168.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><rect x="88.0" y="247.0" width="352.0" height="252.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="116.0" y="300.2" font-size="24.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">보조</tspan></text><text x="116.0" y="329.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#0066cc" font-weight="600" font-family="Malgun Gothic, Arial">사람이 하고, AI가 돕는다</tspan></text><text x="116.0" y="363.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">초안 작성, 요약, 번역, 코드 자동완성.</tspan></text><text x="116.0" y="386.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">결과를 사람이 그대로 검토하므로</tspan></text><text x="116.0" y="409.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">위험이 가장 낮고 도입도 가장 빠르다.</tspan></text><line x1="116.0" y1="443.0" x2="412.0" y2="443.0" stroke="#e0e0e0" stroke-width="1"/><text x="116.0" y="472.2" font-size="14.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="600" font-family="Malgun Gothic, Arial">지금 대부분의 조직</tspan></text><rect x="464.0" y="247.0" width="352.0" height="252.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="492.0" y="300.2" font-size="24.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">자동화</tspan></text><text x="492.0" y="329.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#0066cc" font-weight="600" font-family="Malgun Gothic, Arial">정해진 절차를 맡긴다</tspan></text><text x="492.0" y="363.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">문서 분류, 1차 응대, 데이터 정리.</tspan></text><text x="492.0" y="386.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">예외 처리와 품질 기준을 먼저</tspan></text><text x="492.0" y="409.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">정의해 두어야 작동한다.</tspan></text><line x1="492.0" y1="443.0" x2="788.0" y2="443.0" stroke="#e0e0e0" stroke-width="1"/><text x="492.0" y="472.2" font-size="14.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="600" font-family="Malgun Gothic, Arial">파일럿 단계</tspan></text><rect x="840.0" y="247.0" width="352.0" height="252.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="868.0" y="300.2" font-size="24.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">에이전트</tspan></text><text x="868.0" y="329.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#0066cc" font-weight="600" font-family="Malgun Gothic, Arial">도구를 쓰며 작업을 수행한다</tspan></text><text x="868.0" y="363.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">검색·실행·수정을 스스로 반복.</tspan></text><text x="868.0" y="386.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">권한 범위와 되돌리기 방법을</tspan></text><text x="868.0" y="409.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">설계하는 일이 핵심이 된다.</tspan></text><line x1="868.0" y1="443.0" x2="1164.0" y2="443.0" stroke="#e0e0e0" stroke-width="1"/><text x="868.0" y="472.2" font-size="14.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="600" font-family="Malgun Gothic, Arial">초기 실험 단계</tspan></text><text x="88.0" y="557.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">오른쪽으로 갈수록 효과는 커지지만, </tspan><tspan fill="#0066cc" font-weight="600" font-family="Malgun Gothic, Arial">틀렸을 때 되돌리는 비용도 함께 커진다</tspan><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">. 순서대로 넘어가는 편이 안전하다.</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">02 · 어디에 쓰이나</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">07</text></svg>