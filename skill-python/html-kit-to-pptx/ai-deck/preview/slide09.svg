<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f5f5f7"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">ROADMAP</tspan></text><text x="88.0" y="123.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">네 단계로 나누어 시작한다</tspan></text><rect x="88.0" y="162.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><text x="88.0" y="207.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">도구를 먼저 사는 것이 아니라 업무를 먼저 고른다. 효과를 잴 수 없는 업무에서 시작하면</tspan></text><text x="88.0" y="237.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">도입이 성공했는지 아무도 답하지 못한다.</tspan></text><g transform="translate(88.0,305.0) scale(1.0000,1.0000)"><rect x="0.0" y="0.0" width="255.0" height="3.0" rx="0.0" fill="#0066cc"/><circle cx="18.0" cy="46.0" r="18.0" fill="#0066cc"/><text x="18.0" y="52.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">1</text><text x="0.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f" text-anchor="start">업무 선정</text><text x="0.0" y="142.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">성과를 숫자로 잴 수 있고</text><text x="0.0" y="166.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">틀렸을 때 확인이 가능한 업무부터.</text><rect x="283.0" y="0.0" width="255.0" height="3.0" rx="0.0" fill="#0066cc"/><circle cx="301.0" cy="46.0" r="18.0" fill="#0066cc"/><text x="301.0" y="52.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">2</text><text x="283.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f" text-anchor="start">파일럿 · 측정</text><text x="283.0" y="142.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">도입 전후를 같은 지표로 비교.</text><text x="283.0" y="166.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">체감이 아니라 데이터로 판단한다.</text><rect x="566.0" y="0.0" width="255.0" height="3.0" rx="0.0" fill="#0066cc"/><circle cx="584.0" cy="46.0" r="18.0" fill="#0066cc"/><text x="584.0" y="52.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><text x="566.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f" text-anchor="start">프로세스 재설계</text><text x="566.0" y="142.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">사람이 검토하는 지점을 새로 설계.</text><text x="566.0" y="166.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">도구만 바꾸면 효과는 작다.</text><rect x="849.0" y="0.0" width="255.0" height="3.0" rx="0.0" fill="#0066cc"/><circle cx="867.0" cy="46.0" r="18.0" fill="#0066cc"/><text x="867.0" y="52.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">4</text><text x="849.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f" text-anchor="start">확산 · 역량</text><text x="849.0" y="142.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">성공 사례를 다른 팀으로.</text><text x="849.0" y="166.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">교육과 가이드라인을 함께.</text><line x1="0.0" y1="246.0" x2="1104.0" y2="246.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="274.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">앞의 두 단계를 건너뛰면 세 번째 단계에서 근거가 없어 멈추게 된다.</text></g><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">04 · 어떻게 도입하나</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">09</text></svg>