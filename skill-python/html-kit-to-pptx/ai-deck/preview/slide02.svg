<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f5f5f7"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">AGENDA</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">오늘 다루는 것</tspan></text><rect x="88.0" y="168.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><text x="88.0" y="233.8" font-size="21.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#0066cc" font-weight="600" font-family="Arial">01</tspan></text><text x="162.0" y="235.8" font-size="26.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">무엇이 달라졌나</tspan></text><text x="162.0" y="263.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">규칙을 쓰던 시대에서 생성하는 시대로</tspan></text><line x1="88.0" y1="287.0" x2="1192.0" y2="287.0" stroke="#e0e0e0" stroke-width="1"/><text x="88.0" y="329.8" font-size="21.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#0066cc" font-weight="600" font-family="Arial">02</tspan></text><text x="162.0" y="331.8" font-size="26.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">실제로 무엇을 하나</tspan></text><text x="162.0" y="359.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">업무 단위에서 확인된 효과와 그 한계</tspan></text><line x1="88.0" y1="383.0" x2="1192.0" y2="383.0" stroke="#e0e0e0" stroke-width="1"/><text x="88.0" y="425.8" font-size="21.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#0066cc" font-weight="600" font-family="Arial">03</tspan></text><text x="162.0" y="427.8" font-size="26.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">무엇을 조심해야 하나</tspan></text><text x="162.0" y="455.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">잘하는 일과 아직 못 미더운 일</tspan></text><line x1="88.0" y1="479.0" x2="1192.0" y2="479.0" stroke="#e0e0e0" stroke-width="1"/><text x="88.0" y="521.8" font-size="21.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#0066cc" font-weight="600" font-family="Arial">04</tspan></text><text x="162.0" y="523.8" font-size="26.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">어떻게 도입하나</tspan></text><text x="162.0" y="551.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">네 단계로 나눈 현실적인 순서</tspan></text><line x1="88.0" y1="575.0" x2="1192.0" y2="575.0" stroke="#e0e0e0" stroke-width="1"/><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">개요</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">02</text></svg>