<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#ffffff"/><rect x="0.0" y="0.0" width="640.0" height="664.0" rx="0.0" fill="#ffffff"/><rect x="640.0" y="0.0" width="640.0" height="664.0" rx="0.0" fill="#272729"/><text x="88.0" y="119.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#7a7a7a" font-weight="600" font-family="Arial">JUST WORKS</tspan></text><text x="88.0" y="166.0" font-size="30.0" text-anchor="start" letter-spacing="-0.60"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">잘하는 일</tspan></text><rect x="88.0" y="222.4" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="230.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">형식이 정해진 글을 빠르게 초안화</tspan></text><rect x="88.0" y="268.4" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="276.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">긴 문서에서 필요한 부분 찾아 정리</tspan></text><rect x="88.0" y="314.4" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="322.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">코드 작성과 오류 설명</tspan></text><rect x="88.0" y="360.4" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="368.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">번역, 말투 변환, 분류</tspan></text><line x1="88.0" y1="508.0" x2="552.0" y2="508.0" stroke="#e0e0e0" stroke-width="1"/><text x="88.0" y="542.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">공통점 — 결과가 맞는지 사람이</tspan></text><text x="88.0" y="566.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">곧바로 확인할 수 있다.</tspan></text><text x="728.0" y="119.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#2997ff" font-weight="600" font-family="Arial">NOT YET</tspan></text><text x="728.0" y="166.0" font-size="30.0" text-anchor="start" letter-spacing="-0.60"><tspan fill="#ffffff" font-weight="600" font-family="Malgun Gothic, Arial">아직 못 미더운 일</tspan></text><rect x="728.0" y="222.4" width="7.0" height="7.0" rx="3.5" fill="#2997ff"/><text x="754.0" y="230.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">출처가 필요한 사실 확인 — 그럴듯한</tspan></text><text x="754.0" y="256.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">오답을 자신 있게 내놓는다</tspan></text><rect x="728.0" y="290.4" width="7.0" height="7.0" rx="3.5" fill="#2997ff"/><text x="754.0" y="298.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">최신 정보나 사내 데이터 — 알려준</tspan></text><text x="754.0" y="324.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">범위 밖은 알지 못한다</tspan></text><rect x="728.0" y="358.4" width="7.0" height="7.0" rx="3.5" fill="#2997ff"/><text x="754.0" y="366.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">책임이 따르는 최종 판단</tspan></text><rect x="728.0" y="400.4" width="7.0" height="7.0" rx="3.5" fill="#2997ff"/><text x="754.0" y="408.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">민감 정보 처리 — 무엇을 보내는지</tspan></text><text x="754.0" y="434.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">먼저 정해야 한다</tspan></text><line x1="728.0" y1="508.0" x2="1192.0" y2="508.0" stroke="#3d3d40" stroke-width="1"/><text x="728.0" y="542.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">공통점 — 틀렸을 때 확인 비용이</tspan></text><text x="728.0" y="566.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">크고, 확인 자체가 어렵다.</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">03 · 무엇을 조심해야 하나</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">08</text></svg>