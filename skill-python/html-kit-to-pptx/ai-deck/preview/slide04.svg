<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#ffffff"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">WHAT CHANGED</tspan></text><text x="88.0" y="123.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">규칙을 쓰던 시대에서 생성하는 시대로</tspan></text><rect x="88.0" y="162.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><text x="88.0" y="207.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">세 번의 전환이 있었다. 사람이 규칙을 쓰던 시대, 데이터에서 패턴을 학습하던 시대,</tspan></text><text x="88.0" y="237.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">그리고 언어로 지시하면 결과물 자체를 만들어 내는 지금이다.</tspan></text><g transform="translate(88.0,283.0) scale(1.0000,1.0000)"><line x1="0.0" y1="46.0" x2="1104.0" y2="46.0" stroke="#e0e0e0" stroke-width="2"/><circle cx="18.0" cy="46.0" r="9.0" fill="#86868b" stroke="#ffffff" stroke-width="3"/><text x="0.0" y="24.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="start">~1990년대</text><text x="0.0" y="88.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d1d1f" text-anchor="start">규칙 기반</text><text x="0.0" y="120.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">사람이 규칙을 직접 작성.</text><text x="0.0" y="143.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">규칙 밖의 상황은 처리 불가.</text><circle cx="300.0" cy="46.0" r="9.0" fill="#86868b" stroke="#ffffff" stroke-width="3"/><text x="282.0" y="24.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="start">2000년대</text><text x="282.0" y="88.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d1d1f" text-anchor="start">통계적 학습</text><text x="282.0" y="120.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">데이터에서 패턴을 학습.</text><text x="282.0" y="143.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">특징은 여전히 사람이 설계.</text><circle cx="582.0" cy="46.0" r="9.0" fill="#86868b" stroke="#ffffff" stroke-width="3"/><text x="564.0" y="24.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="start">2010년대</text><text x="564.0" y="88.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d1d1f" text-anchor="start">딥러닝</text><text x="564.0" y="120.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">특징 설계까지 학습이 대체.</text><text x="564.0" y="143.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">이미지·음성 인식이 실용화.</text><circle cx="864.0" cy="46.0" r="9.0" fill="#0066cc" stroke="#ffffff" stroke-width="3"/><text x="846.0" y="24.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="start">2020년대</text><text x="846.0" y="88.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#0066cc" text-anchor="start">생성형 · 에이전트</text><text x="846.0" y="120.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">언어로 지시하고 결과를 생성.</text><text x="846.0" y="143.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">도구를 쓰고 작업을 수행.</text><rect x="846.0" y="174.0" width="238.0" height="3.0" rx="0.0" fill="#0066cc"/><text x="846.0" y="204.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="600" fill="#0066cc" text-anchor="start">지금 여기</text></g><text x="88.0" y="553.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">달라진 것은 정확도만이 아니라 </tspan><tspan fill="#0066cc" font-weight="600" font-family="Malgun Gothic, Arial">쓰는 방법</tspan><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">이다. 전문가가 모델을 설계하던 일을, 이제는 누구나 문장으로 지시한다.</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">01 · 무엇이 달라졌나</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">04</text></svg>