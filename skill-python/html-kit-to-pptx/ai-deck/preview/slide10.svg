<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#252527"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#2997ff" font-weight="600" font-family="Arial">IN ONE LINE</tspan></text><text x="88.0" y="212.0" font-size="40.0" text-anchor="start" letter-spacing="-0.80"><tspan fill="#ffffff" font-weight="400" font-family="Malgun Gothic, Arial">도구를 도입하는 일이 아니라,</tspan></text><text x="88.0" y="270.0" font-size="40.0" text-anchor="start" letter-spacing="-0.80"><tspan fill="#2997ff" font-weight="400" font-family="Malgun Gothic, Arial">일하는 방식을 다시 설계하는 일이다.</tspan></text><rect x="88.0" y="336.9" width="7.0" height="7.0" rx="3.5" fill="#2997ff"/><text x="114.0" y="345.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">확인 가능한 업무부터 고른다 — 효과를 숫자로 말할 수 있어야 한다.</tspan></text><rect x="88.0" y="380.9" width="7.0" height="7.0" rx="3.5" fill="#2997ff"/><text x="114.0" y="389.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">검증 단계를 업무 절차에 넣는다 — 확률적 산출이라는 성질은 사라지지 않는다.</tspan></text><rect x="88.0" y="424.9" width="7.0" height="7.0" rx="3.5" fill="#2997ff"/><text x="114.0" y="433.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">사람의 역할을 다시 정의한다 — 도구만 바꾸면 효과는 작다.</tspan></text><line x1="88.0" y1="556.0" x2="1192.0" y2="556.0" stroke="#3d3d40" stroke-width="1"/><text x="88.0" y="589.2" font-size="14.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">출처 — Peng et al.(2023) · Noy &amp; Zhang(2023) · Brynjolfsson, Li &amp; Raymond(2025) ·</tspan></text><text x="88.0" y="610.2" font-size="14.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">서동현 외(2026), 한국은행 BOK 이슈노트. 디자인 — slides-reference-apple.html (Arial).</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="#3d3d40" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#cccccc">맺음</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#ffffff" text-anchor="end">10</text></svg>