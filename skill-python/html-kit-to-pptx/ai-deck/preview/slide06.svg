<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#ffffff"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">EVIDENCE</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">업무 단위에서는</tspan></text><text x="88.0" y="181.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">효과가 확인됐다</tspan></text><rect x="88.0" y="220.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><rect x="88.0" y="259.9" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="268.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">코딩, 글쓰기, 고객상담처럼 결과를 바로</tspan></text><text x="114.0" y="296.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">확인할 수 있는 업무에서 효율이 크게</tspan></text><text x="114.0" y="324.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">개선됐다.</tspan></text><rect x="88.0" y="367.9" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="376.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">다만 실제 업무환경을 설문한 결과는</tspan></text><text x="114.0" y="404.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">훨씬 작았다. 적용하기 쉬운 업무에</tspan></text><text x="114.0" y="432.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">한정된 효과라는 뜻이다.</tspan></text><g transform="translate(632.0,176.0) scale(1.0000,1.0000)"><line x1="178.0" y1="44.0" x2="178.0" y2="308.0" stroke="#e0e0e0" stroke-width="1"/><text x="178.0" y="328.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">0%</text><line x1="256.0" y1="44.0" x2="256.0" y2="308.0" stroke="#e0e0e0" stroke-width="1"/><text x="256.0" y="328.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">15%</text><line x1="334.0" y1="44.0" x2="334.0" y2="308.0" stroke="#e0e0e0" stroke-width="1"/><text x="334.0" y="328.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">30%</text><line x1="412.0" y1="44.0" x2="412.0" y2="308.0" stroke="#e0e0e0" stroke-width="1"/><text x="412.0" y="328.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">45%</text><line x1="490.0" y1="44.0" x2="490.0" y2="308.0" stroke="#e0e0e0" stroke-width="1"/><text x="490.0" y="328.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">60%</text><rect x="178.0" y="54.0" width="290.2" height="32.0" rx="4.0" fill="#0066cc"/><text x="480.2" y="76.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start">55.8%</text><text x="162.0" y="70.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="end">코딩 속도</text><text x="162.0" y="88.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="end">Peng et al. (2023)</text><rect x="178.0" y="126.0" width="208.0" height="32.0" rx="4.0" fill="#0066cc"/><text x="398.0" y="148.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start">40%</text><text x="162.0" y="142.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="end">글쓰기 과제</text><text x="162.0" y="160.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="end">Noy &amp; Zhang (2023)</text><rect x="178.0" y="198.0" width="124.3" height="32.0" rx="4.0" fill="#0066cc"/><text x="314.3" y="220.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start">23.9%</text><text x="162.0" y="214.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="end">고객상담 처리량</text><text x="162.0" y="232.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="end">Brynjolfsson et al. (2025)</text><rect x="178.0" y="270.0" width="19.8" height="32.0" rx="4.0" fill="#86868b"/><text x="209.8" y="292.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start">3.8%</text><text x="162.0" y="286.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="end">업무시간 단축</text><text x="162.0" y="304.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="end">서동현 외 (2026), 설문</text><text x="0.0" y="356.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="start">통제된 실험(파랑)과 실제 업무환경 설문(회색)은 성격이 다른 수치다.</text></g><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">02 · 어디에 쓰이나</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">06</text></svg>