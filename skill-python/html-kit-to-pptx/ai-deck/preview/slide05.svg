<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f5f5f7"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">HOW IT WORKS</tspan></text><text x="88.0" y="123.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">답을 아는 것이 아니라, 그럴듯한 말을 고른다</tspan></text><rect x="88.0" y="162.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><g transform="translate(88.0,211.0) scale(1.0000,1.0000)"><defs><marker id="pipe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a7a"/></marker></defs><rect x="0.0" y="40.0" width="184.0" height="132.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="24.0" y="80.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1d1f" text-anchor="start">입력</text><text x="24.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">질문 + 맥락</text><text x="24.0" y="130.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">(문서 · 데이터)</text><line x1="194.0" y1="106.0" x2="218.0" y2="106.0" stroke="#7a7a7a" stroke-width="2" marker-end="url(#pipe)"/><rect x="230.0" y="40.0" width="184.0" height="132.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="254.0" y="80.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1d1f" text-anchor="start">토큰화</text><text x="254.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">글자를 조각으로</text><text x="254.0" y="130.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">나누어 숫자로</text><line x1="424.0" y1="106.0" x2="448.0" y2="106.0" stroke="#7a7a7a" stroke-width="2" marker-end="url(#pipe)"/><rect x="460.0" y="40.0" width="184.0" height="132.0" rx="18.0" fill="#ffffff" stroke="#0066cc" stroke-width="2"/><text x="484.0" y="80.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="600" fill="#0066cc" text-anchor="start">모델</text><text x="484.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">다음 조각의</text><text x="484.0" y="130.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">확률을 예측</text><line x1="654.0" y1="106.0" x2="678.0" y2="106.0" stroke="#7a7a7a" stroke-width="2" marker-end="url(#pipe)"/><rect x="690.0" y="40.0" width="184.0" height="132.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="714.0" y="80.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1d1f" text-anchor="start">출력</text><text x="714.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">가장 그럴듯한</text><text x="714.0" y="130.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">문장을 생성</text><line x1="884.0" y1="106.0" x2="908.0" y2="106.0" stroke="#7a7a7a" stroke-width="2" marker-end="url(#pipe)"/><rect x="920.0" y="40.0" width="184.0" height="132.0" rx="18.0" fill="#ffffff" stroke="#0066cc" stroke-width="2"/><text x="944.0" y="80.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="600" fill="#0066cc" text-anchor="start">검증</text><text x="944.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">사람 또는 도구가</text><text x="944.0" y="130.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">결과를 확인</text><rect x="0.0" y="216.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><text x="0.0" y="250.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="18" font-weight="600" fill="#1d1d1f" text-anchor="start">같은 질문에도 매번 같은 답이 나오지 않는다.</text><text x="0.0" y="278.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">정해진 규칙이 아니라 확률에 따라 문장을 고르기 때문 — 그래서 마지막 검증 단계가 선택이 아니라 필수다.</text></g><text x="88.0" y="559.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">이 구조를 이해하면 왜 자신 있게 틀린 답을 내놓는지, 왜 검증 절차가 업무 설계의 일부여야 하는지가 설명된다.</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">01 · 무엇이 달라졌나</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">05</text></svg>