<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="230" viewBox="0 0 1104 230"><line x1="0.0" y1="46.0" x2="1104.0" y2="46.0" stroke="#e0e0e0" stroke-width="2"/><circle cx="18.0" cy="46.0" r="9.0" fill="#86868b" stroke="#ffffff" stroke-width="3"/><text x="0.0" y="24.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="start">~1990년대</text><text x="0.0" y="88.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d1d1f" text-anchor="start">규칙 기반</text><text x="0.0" y="120.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">사람이 규칙을 직접 작성.</text><text x="0.0" y="143.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">규칙 밖의 상황은 처리 불가.</text><circle cx="300.0" cy="46.0" r="9.0" fill="#86868b" stroke="#ffffff" stroke-width="3"/><text x="282.0" y="24.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="start">2000년대</text><text x="282.0" y="88.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d1d1f" text-anchor="start">통계적 학습</text><text x="282.0" y="120.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">데이터에서 패턴을 학습.</text><text x="282.0" y="143.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">특징은 여전히 사람이 설계.</text><circle cx="582.0" cy="46.0" r="9.0" fill="#86868b" stroke="#ffffff" stroke-width="3"/><text x="564.0" y="24.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="start">2010년대</text><text x="564.0" y="88.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d1d1f" text-anchor="start">딥러닝</text><text x="564.0" y="120.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">특징 설계까지 학습이 대체.</text><text x="564.0" y="143.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">이미지·음성 인식이 실용화.</text><circle cx="864.0" cy="46.0" r="9.0" fill="#0066cc" stroke="#ffffff" stroke-width="3"/><text x="846.0" y="24.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="start">2020년대</text><text x="846.0" y="88.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#0066cc" text-anchor="start">생성형 · 에이전트</text><text x="846.0" y="120.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">언어로 지시하고 결과를 생성.</text><text x="846.0" y="143.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">도구를 쓰고 작업을 수행.</text><rect x="846.0" y="174.0" width="238.0" height="3.0" rx="0.0" fill="#0066cc"/><text x="846.0" y="204.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="600" fill="#0066cc" text-anchor="start">지금 여기</text></svg>