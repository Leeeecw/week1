<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="290" viewBox="0 0 1104 290"><rect x="0.0" y="0.0" width="255.0" height="3.0" rx="0.0" fill="#0066cc"/><circle cx="18.0" cy="46.0" r="18.0" fill="#0066cc"/><text x="18.0" y="52.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">1</text><text x="0.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f" text-anchor="start">업무 선정</text><text x="0.0" y="142.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">성과를 숫자로 잴 수 있고</text><text x="0.0" y="166.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">틀렸을 때 확인이 가능한 업무부터.</text><rect x="283.0" y="0.0" width="255.0" height="3.0" rx="0.0" fill="#0066cc"/><circle cx="301.0" cy="46.0" r="18.0" fill="#0066cc"/><text x="301.0" y="52.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">2</text><text x="283.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f" text-anchor="start">파일럿 · 측정</text><text x="283.0" y="142.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">도입 전후를 같은 지표로 비교.</text><text x="283.0" y="166.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">체감이 아니라 데이터로 판단한다.</text><rect x="566.0" y="0.0" width="255.0" height="3.0" rx="0.0" fill="#0066cc"/><circle cx="584.0" cy="46.0" r="18.0" fill="#0066cc"/><text x="584.0" y="52.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><text x="566.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f" text-anchor="start">프로세스 재설계</text><text x="566.0" y="142.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">사람이 검토하는 지점을 새로 설계.</text><text x="566.0" y="166.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">도구만 바꾸면 효과는 작다.</text><rect x="849.0" y="0.0" width="255.0" height="3.0" rx="0.0" fill="#0066cc"/><circle cx="867.0" cy="46.0" r="18.0" fill="#0066cc"/><text x="867.0" y="52.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">4</text><text x="849.0" y="108.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f" text-anchor="start">확산 · 역량</text><text x="849.0" y="142.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">성공 사례를 다른 팀으로.</text><text x="849.0" y="166.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">교육과 가이드라인을 함께.</text><line x1="0.0" y1="246.0" x2="1104.0" y2="246.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="274.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">앞의 두 단계를 건너뛰면 세 번째 단계에서 근거가 없어 멈추게 된다.</text></svg>