<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="190" viewBox="0 0 1104 190"><rect x="0.0" y="0.0" width="349.3" height="190.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><circle cx="41.0" cy="45.0" r="17" fill="#0066cc"/><text x="41.0" y="50.0" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">01</text><text x="24.0" y="100.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1d1f" text-anchor="start">연관 기술의 발전</text><text x="24.0" y="132.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">고압증기가 증기기관의 쓰임을 넓혔듯,</text><text x="24.0" y="156.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">AI 활용의 문턱을 낮추는 기술이 필요</text><rect x="377.3" y="0.0" width="349.3" height="190.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><circle cx="418.3" cy="45.0" r="17" fill="#0066cc"/><text x="418.3" y="50.0" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">02</text><text x="401.3" y="100.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1d1f" text-anchor="start">업무 프로세스의 재설계</text><text x="401.3" y="132.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">확률적 산출을 전제로 한 검증 절차 —</text><text x="401.3" y="156.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">기존 소프트웨어와 같은 방식으로 쓸 수 없음</text><rect x="754.7" y="0.0" width="349.3" height="190.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><circle cx="795.7" cy="45.0" r="17" fill="#0066cc"/><text x="795.7" y="50.0" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">03</text><text x="778.7" y="100.