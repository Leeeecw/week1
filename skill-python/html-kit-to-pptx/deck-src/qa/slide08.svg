<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f5f5f7"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">FIRM LEVEL</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">기업 수준에서는 효과가 일관되게 확인되지 않는다</tspan></text><rect x="88.0" y="168.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><rect x="88.0" y="227.0" width="352.0" height="244.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="116.0" y="270.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">간접지표로 본 연구</tspan></text><text x="116.0" y="303.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">AI 인력 채용은 생산성에 유의한 영향이</tspan></text><text x="116.0" y="326.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">없었다(Babina 2024). 반면 AI 특허출원은</tspan></text><text x="116.0" y="349.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">노동생산성과 양(+)의 상관을 보였다</tspan></text><text x="116.0" y="372.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Arial">(Alderucci 2020; Damioli 2021).</tspan></text><line x1="116.0" y1="409.0" x2="412.0" y2="409.0" stroke="#e0e0e0" stroke-width="1"/><text x="116.0" y="439.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#0066cc" font-weight="600" font-family="Malgun Gothic, Arial">결과가 엇갈림</tspan></text><rect x="464.0" y="227.0" width="352.0" height="244.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="492.0" y="270.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">서베이 기반 연구</tspan></text><text x="492.0" y="303.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">AI 도입 기업의 생산성이 더 높게 나왔지만,</tspan></text><text x="492.0" y="326.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">통제변수를 넣으면 유의성이 사라졌다</tspan></text><text x="492.0" y="349.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">(Acemoglu 2022). OECD 9개국에서도 ICT</tspan></text><text x="492.0" y="372.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">역량을 통제하자 계수가 크게 낮아졌다.</tspan></text><line x1="492.0" y1="409.0" x2="788.0" y2="409.0" stroke="#e0e0e0" stroke-width="1"/><text x="492.0" y="439.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#0066cc" font-weight="600" font-family="Malgun Gothic, Arial">통제하면 사라짐</tspan></text><rect x="840.0" y="227.0" width="352.0" height="244.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="868.0" y="270.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">국내 연구</tspan></text><text x="868.0" y="303.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">국내 기업의 AI 도입은 노동생산성에</tspan></text><text x="868.0" y="326.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">유의한 효과가 없었다(오삼일 외 2025).</tspan></text><text x="868.0" y="349.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">도입 이후 최대 6년까지도 유의하지 않았다</tspan></text><text x="868.0" y="372.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">(남충현 2026).</tspan></text><line x1="868.0" y1="409.0" x2="1164.0" y2="409.0" stroke="#e0e0e0" stroke-width="1"/><text x="868.0" y="439.8" font-size="16.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#0066cc" font-weight="600" font-family="Malgun Gothic, Arial">6년까지 유의하지 않음</tspan></text><text x="88.0" y="527.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">개인의 업무 효율이 기업의 산출로 합쳐지려면, </tspan><tspan fill="#0066cc" font-weight="600" font-family="Malgun Gothic, Arial">AI가 적용된 업무가 기업 활동에서 차지하는 비중</tspan><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">이 충분히 커야 한다.</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">02 · 생산성 효과와 전망</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">08</text></svg>