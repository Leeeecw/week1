<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#ffffff"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">IMPLICATIONS</tspan></text><text x="88.0" y="123.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">AI가 넘어야 할 세 가지</tspan></text><rect x="88.0" y="162.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><text x="88.0" y="206.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">지금의 AI는 주로 챗봇 형태로, 사무직·전문직 업무를 중심으로 쓰인다.</tspan></text><text x="88.0" y="234.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">역사적으로 범용기술이 성장에 크게 기여한 시기는 생산공정에 본격적으로 쓰이기 시작한 이후였다.</tspan></text><g transform="translate(88.0,291.0) scale(1.0000,1.0000)"><rect x="0.0" y="0.0" width="349.3" height="190.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><circle cx="41.0" cy="45.0" r="17" fill="#0066cc"/><text x="41.0" y="50.0" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">01</text><text x="24.0" y="100.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1d1f" text-anchor="start">연관 기술의 발전</text><text x="24.0" y="132.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">고압증기가 증기기관의 쓰임을 넓혔듯,</text><text x="24.0" y="156.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">AI 활용의 문턱을 낮추는 기술이 필요</text><rect x="377.3" y="0.0" width="349.3" height="190.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><circle cx="418.3" cy="45.0" r="17" fill="#0066cc"/><text x="418.3" y="50.0" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">02</text><text x="401.3" y="100.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1d1f" text-anchor="start">업무 프로세스의 재설계</text><text x="401.3" y="132.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">확률적 산출을 전제로 한 검증 절차 —</text><text x="401.3" y="156.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">기존 소프트웨어와 같은 방식으로 쓸 수 없음</text><rect x="754.7" y="0.0" width="349.3" height="190.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><circle cx="795.7" cy="45.0" r="17" fill="#0066cc"/><text x="795.7" y="50.0" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">03</text><text x="778.7" y="100.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1d1f" text-anchor="start">현장으로의 확장</text><text x="778.7" y="132.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">사무직 챗봇을 넘어 생산공정까지.</text><text x="778.7" y="156.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">피지컬 AI가 그 계기가 될 수 있음</text></g><text x="88.0" y="534.6" font-size="17.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">여기에 더해, 초기 투자의 불확실성을 덜어 줄 </tspan><tspan fill="#0066cc" font-weight="600" font-family="Malgun Gothic, Arial">금융기법</tspan><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">도 필요하다 — 와트가 절감된 석탄 비용의 일부를</tspan></text><text x="88.0" y="559.6" font-size="17.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">나눠 받는 성과연동 계약으로 증기기관을 팔았던 것처럼.</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">04 · 시사점과 결론</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">18</text></svg>