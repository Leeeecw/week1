<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#272729"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#2997ff" font-weight="600" font-family="Arial">CONCLUSION</tspan></text><text x="88.0" y="252.0" font-size="40.0" text-anchor="start" letter-spacing="-0.80"><tspan fill="#ffffff" font-weight="400" font-family="Malgun Gothic, Arial">혁신이 일부 기업이나 산업에 머무르지 않고</tspan></text><text x="88.0" y="310.0" font-size="40.0" text-anchor="start" letter-spacing="-0.80"><tspan fill="#ffffff" font-weight="400" font-family="Malgun Gothic, Arial">경제 전반에 걸쳐 확산될 때 비로소</tspan></text><text x="88.0" y="368.0" font-size="40.0" text-anchor="start" letter-spacing="-0.80"><tspan fill="#2997ff" font-weight="400" font-family="Malgun Gothic, Arial">AI의 거시적 성장효과가 실현된다.</tspan></text><rect x="88.0" y="450.0" width="44.0" height="2.0" rx="0.0" fill="#2997ff"/><text x="148.0" y="454.0" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">한국은행 경제연구원 거시경제연구실 · 2026. 7. 28.</tspan></text><text x="88.0" y="527.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">그 확산은 다양한 연관 기술의 개발과 조직혁신, 그리고 지속적인 유·무형자산 투자로 뒷받침된다.</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#cccccc">04 · 시사점과 결론</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#ffffff" text-anchor="end">19</text></svg>