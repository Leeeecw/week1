<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f5f5f7"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">STEAM</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">탄광 펌프에서</tspan></text><text x="88.0" y="181.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">가장 주된 동력원까지 70년</tspan></text><rect x="88.0" y="220.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><rect x="88.0" y="259.9" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="268.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">초기 증기기관은 대기압 수준의 저압 증기를</tspan></text><text x="114.0" y="296.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">써서 출력과 연료 효율이 낮았고, 탄광 배수</tspan></text><text x="114.0" y="324.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">펌프 같은 제한된 용도에만 쓰였다.</tspan></text><rect x="88.0" y="367.9" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="376.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">19세기 초 고압 증기기관이 나오면서 공장</tspan></text><text x="114.0" y="404.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">기계·기관차·증기선으로 쓰임이 넓어졌고,</tspan></text><text x="114.0" y="432.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">그때부터 성장 기여도가 높아졌다.</tspan></text><g transform="translate(660.0,200.0) scale(1.0000,1.0000)"><line x1="58.0" y1="274.0" x2="496.0" y2="274.0" stroke="#f0f0f0" stroke-width="1"/><text x="48.0" y="278.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="end">0%</text><line x1="58.0" y1="217.0" x2="496.0" y2="217.0" stroke="#f0f0f0" stroke-width="1"/><text x="48.0" y="221.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="end">25%</text><line x1="58.0" y1="160.0" x2="496.0" y2="160.0" stroke="#f0f0f0" stroke-width="1"/><text x="48.0" y="164.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="end">50%</text><line x1="58.0" y1="103.0" x2="496.0" y2="103.0" stroke="#f0f0f0" stroke-width="1"/><text x="48.0" y="107.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="end">75%</text><line x1="58.0" y1="46.0" x2="496.0" y2="46.0" stroke="#f0f0f0" stroke-width="1"/><text x="48.0" y="50.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="end">100%</text><path d="M 58.0 260.5 L 177.2 227.0 L 266.6 166.6 L 385.8 69.7 L 496.0 50.3" fill="none" stroke="#0066cc" stroke-width="2.5" stroke-linejoin="round"/><circle cx="58.0" cy="260.5" r="5" fill="#0066cc" stroke="#ffffff" stroke-width="2"/><text x="72.0" y="265.5" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="start">5.9%</text><text x="58.0" y="296.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="middle">1760</text><circle cx="177.2" cy="227.0" r="5" fill="#0066cc" stroke="#ffffff" stroke-width="2"/><text x="177.2" y="213.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">20.6%</text><text x="177.2" y="296.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="middle">1800</text><circle cx="266.6" cy="166.6" r="5" fill="#0066cc" stroke="#ffffff" stroke-width="2"/><text x="266.6" y="152.6" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">47.1%</text><text x="266.6" y="296.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="middle">1830</text><circle cx="385.8" cy="69.7" r="5" fill="#0066cc" stroke="#ffffff" stroke-width="2"/><text x="385.8" y="55.7" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">89.6%</text><text x="385.8" y="296.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="middle">1870</text><circle cx="496.0" cy="50.3" r="5" fill="#0066cc" stroke="#ffffff" stroke-width="2"/><text x="496.0" y="36.3" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">98.1%</text><text x="496.0" y="296.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="middle">1907</text><text x="0.0" y="18.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="start">영국 총 설치 마력 중 증기기관 비중</text><text x="0.0" y="322.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="start">자료: Crafts(2004)</text></g><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">03 · 범용기술 확산의 역사</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">14</text></svg>