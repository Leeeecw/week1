<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f5f5f7"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">INFORMATION TECHNOLOGY</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">만든 쪽보다</tspan></text><text x="88.0" y="181.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">쓴 쪽의 기여가 더 컸다</tspan></text><rect x="88.0" y="220.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><rect x="88.0" y="253.9" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="262.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">IT 자본재 가격이 떨어지며 투자가 급증했다.</tspan></text><text x="114.0" y="290.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">수량 기준 1990~95년 연 11.5%, 1995~99년</tspan></text><text x="114.0" y="318.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">연 19.4% 증가.</tspan></text><rect x="88.0" y="359.9" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="368.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">생산성 기여도 증가분은 IT 생산부문 +0.17%p,</tspan></text><text x="114.0" y="396.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">IT 활용부문 +0.83%p로 활용 쪽이 다섯 배</tspan></text><text x="114.0" y="424.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">가까이 컸다 (Stiroh, 2002).</tspan></text><g transform="translate(672.0,172.0) scale(1.0000,1.0000)"><line x1="58.0" y1="284.0" x2="500.0" y2="284.0" stroke="#f0f0f0" stroke-width="1"/><text x="48.0" y="288.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="end">0.0</text><line x1="58.0" y1="223.4" x2="500.0" y2="223.4" stroke="#f0f0f0" stroke-width="1"/><text x="48.0" y="227.4" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="end">0.5</text><line x1="58.0" y1="162.9" x2="500.0" y2="162.9" stroke="#f0f0f0" stroke-width="1"/><text x="48.0" y="166.9" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="end">1.0</text><line x1="58.0" y1="102.3" x2="500.0" y2="102.3" stroke="#f0f0f0" stroke-width="1"/><text x="48.0" y="106.3" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="end">1.5</text><rect x="98.5" y="239.2" width="66.0" height="44.8" rx="4.0" fill="#86868b"/><text x="131.5" y="229.2" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">0.37</text><rect x="172.5" y="193.2" width="66.0" height="90.8" rx="4.0" fill="#0066cc"/><text x="205.5" y="183.2" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">0.75</text><text x="168.5" y="308.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">1987–1995</text><rect x="319.5" y="218.6" width="66.0" height="65.4" rx="4.0" fill="#86868b"/><text x="352.5" y="208.6" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">0.54</text><rect x="393.5" y="92.6" width="66.0" height="191.4" rx="4.0" fill="#0066cc"/><text x="426.5" y="82.6" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">1.58</text><text x="389.5" y="308.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">1995–2000</text><rect x="58.0" y="20.0" width="11.0" height="11.0" rx="2.0" fill="#86868b"/><text x="76.0" y="30.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">IT 생산부문</text><rect x="188.0" y="20.0" width="11.0" height="11.0" rx="2.0" fill="#0066cc"/><text x="206.0" y="30.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">IT 활용부문</text><text x="0.0" y="340.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="start">기여도 증감:  생산부문 +0.17%p   ·   활용부문 +0.83%p</text><text x="0.0" y="372.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a7a7a" text-anchor="start">미국 연평균 노동생산성 성장 기여도(%p) · 자료: Stiroh(2002)</text></g><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">03 · 범용기술 확산의 역사</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">17</text></svg>