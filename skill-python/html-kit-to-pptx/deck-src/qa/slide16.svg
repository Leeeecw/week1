<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#ffffff"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">DIFFUSION</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">그리고 1919년, 순서가 바뀌었다</tspan></text><rect x="88.0" y="168.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><rect x="88.0" y="211.9" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="220.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">미국 제조업 동력원에서 전기 비중이 53.1%로</tspan></text><text x="114.0" y="248.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">증기(40.7%)를 처음 넘어섰다.</tspan></text><rect x="88.0" y="291.9" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="300.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">수력발전소 인근 지역에서는 10년 안에 생산성</tspan></text><text x="114.0" y="328.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">효과가 나타났지만, 전국 수준의 생산성 증가로</tspan></text><text x="114.0" y="356.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">이어지기까지는 20~30년이 더 걸렸다</tspan></text><text x="114.0" y="384.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Arial">(Fiszbein et al., 2020).</tspan></text><g transform="translate(652.0,190.0) scale(1.0000,1.0000)"