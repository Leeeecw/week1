<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#fafafc"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">KEY TAKEAWAY</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">네 문장으로 보는 결론</tspan></text><rect x="88.0" y="168.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><rect x="88.0" y="205.0" width="538.0" height="186.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="116.0" y="232.0" width="30.0" height="30.0" rx="15.0" fill="#0066cc"/><text x="131.0" y="248.4" font-size="13.0" text-anchor="middle" letter-spacing="0.00"><tspan fill="#ffffff" font-weight="600" font-family="Arial">01</tspan></text><text x="116.0" y="294.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">미시적 효과는 이미 확인된다</tspan></text><text x="116.0" y="327.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">고객 문의 처리·코딩 등 개별 업무에서 효율이</tspan></text><text x="116.0" y="350.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">즉시 개선됐다. 다만 AI를 적용하기 쉬운 일부</tspan></text><text x="116.0" y="373.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">업무에서 관찰된 결과다.</tspan></text><rect x="654.0" y="205.0" width="538.0" height="186.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="682.0" y="232.0" width="30.0" height="30.0" rx="15.0" fill="#0066cc"/><text x="697.0" y="248.4" font-size="13.0" text-anchor="middle" letter-spacing="0.00"><tspan fill="#ffffff" font-weight="600" font-family="Arial">02</tspan></text><text x="682.0" y="294.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">거시 효과는 적용 범위가 좌우한다</tspan></text><text x="682.0" y="327.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">같은 절감률을 가정해도 그 업무가 GDP에서</tspan></text><text x="682.0" y="350.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">차지하는 비중에 따라 전망은 연 0.07%p에서</tspan></text><text x="682.0" y="373.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">2.6%p까지 벌어진다.</tspan></text><rect x="88.0" y="419.0" width="538.0" height="186.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="116.0" y="446.0" width="30.0" height="30.0" rx="15.0" fill="#0066cc"/><text x="131.0" y="462.4" font-size="13.0" text-anchor="middle" letter-spacing="0.00"><tspan fill="#ffffff" font-weight="600" font-family="Arial">03</tspan></text><text x="116.0" y="508.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">과거 범용기술도 늦게 왔다</tspan></text><text x="116.0" y="541.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">증기·전기·정보기술 모두 초기 기여도는 낮았고,</tspan></text><text x="116.0" y="564.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">경제 전반으로 확산된 뒤에야 성장에 본격적으로</tspan></text><text x="116.0" y="587.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">기여하기 시작했다.</tspan></text><rect x="654.0" y="419.0" width="538.0" height="186.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="682.0" y="446.0" width="30.0" height="30.0" rx="15.0" fill="#0066cc"/><text x="697.0" y="462.4" font-size="13.0" text-anchor="middle" letter-spacing="0.00"><tspan fill="#ffffff" font-weight="600" font-family="Arial">04</tspan></text><text x="682.0" y="508.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">확산을 막는 한계를 넘어야 한다</tspan></text><text x="682.0" y="541.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">연관 기술의 발전, 업무 프로세스의 재설계,</tspan></text><text x="682.0" y="564.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">그리고 생산 현장으로의 확장이 함께 이루어질 때</tspan></text><text x="682.0" y="587.7" font-size="15.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#7a7a7a" font-weight="400" font-family="Malgun Gothic, Arial">거시적 효과가 실현된다.</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">핵심 요약</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">02</text></svg>