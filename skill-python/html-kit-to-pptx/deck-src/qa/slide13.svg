 x="88.0" y="585.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">증기기관은 첫 70년 동안 연 0.014%p에 그쳤다가 다음 40년에 0.30%p로 올라섰고, </tspan></text><text x="88.0" y="611.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">정보기술은 1995~2004년에 1.50%p로 정점을 찍은 뒤 다시 낮아졌다.</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">03 · 범용기술 확산의 역사</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">13</text></svg>