<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#ffffff"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">WHAT DRIVES THE SPREAD</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">전망을 가르는 세 가지 변수</tspan></text><rect x="88.0" y="168.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><rect x="88.0" y="223.0" width="1104.0" height="1.0" rx="0.0" fill="#e0e0e0"/><rect x="88.0" y="247.0" width="32.0" height="32.0" rx="16.0" fill="#0066cc"/><text x="104.0" y="264.4" font-size="13.0" text-anchor="middle" letter-spacing="0.00"><tspan fill="#ffffff" font-weight="600" font-family="Arial">01</tspan></text><text x="144.0" y="266.6" font-size="22.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">업무 간 대체탄력성</tspan></text><text x="518.0" y="264.6" font-size="17.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">task 사이의 대체성이 낮으면 자동화가 어려운 업무가 '약한 고리'로 남아</tspan></text><text x="518.0" y="291.6" font-size="17.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">전체 생산과정을 제약한다 (Jones 2026; Anthropic 2026).</tspan></text><rect x="88.0" y="347.0" width="1104.0" height="1.0" rx="0.0" fill="#e0e0e0"/><rect x="88.0" y="371.0" width="32.0" height="32.0" rx="16.0" fill="#0066cc"/><text x="104.0" y="388.4" font-size="13.0" text-anchor="middle" letter-spacing="0.00"><tspan fill="#ffffff" font-weight="600" font-family="Arial">02</tspan></text><text x="144.0" y="390.6" font-size="22.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">물리적 업무의 자동화</tspan></text><text x="518.0" y="388.6" font-size="17.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">지금 적용이 쉬운 일은 사무직·전문직의 인지적 업무에 몰려 있다. 생산직의</tspan></text><text x="518.0" y="415.6" font-size="17.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">물리적 업무까지 확대되면 효과는 더 커진다 (Filippucci et al. 2024).</tspan></text><rect x="88.0" y="471.0" width="1104.0" height="1.0" rx="0.0" fill="#e0e0e0"/><rect x="88.0" y="495.0" width="32.0" height="32.0" rx="16.0" fill="#0066cc"/><text x="104.0" y="512.4" font-size="13.0" text-anchor="middle" letter-spacing="0.00"><tspan fill="#ffffff" font-weight="600" font-family="Arial">03</tspan></text><text x="144.0" y="514.6" font-size="22.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">도입 비용의 하락 속도</tspan></text><text x="518.0" y="512.6" font-size="17.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">연산 비용이 기하급수적으로 낮아진다는 낙관론과, 전력비·인건비가 남아</tspan></text><text x="518.0" y="539.6" font-size="17.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">절반으로 줄지는 않는다는 반론이 맞선다 (Aghion &amp; Bunel 2025).</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">02 · 생산성 효과와 전망</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">11</text></svg>