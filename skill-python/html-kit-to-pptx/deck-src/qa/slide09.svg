<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#ffffff"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">DECOMPOSITION</tspan></text><text x="88.0" y="123.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">같은 절감률, 다른 결론</tspan></text><rect x="88.0" y="162.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><text x="88.0" y="207.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">두 연구 모두 노동비용 절감률을 27~40%로 높게 잡았다. 결과가 18배 갈린 이유는</tspan></text><text x="88.0" y="237.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#333333" font-weight="400" font-family="Malgun Gothic, Arial">10년 안에 AI가 실제로 적용될 task의 GDP 비중을 각각 4.6%와 54.4%로 봤기 때문이다.</tspan></text><g transform="translate(88.0,275.0) scale(1.0000,1.0000)"><defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0066cc"/></marker></defs><rect x="0.0" y="0.0" width="1104.0" height="68.0" rx="11.0" fill="#f5f5f7"/><text x="28.0" y="42.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f" text-anchor="start">AI에 의한 거시 TFP 증가율  =</text><text x="298.0" y="42.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="400" fill="#0066cc" text-anchor="start">AI가 실제 적용될 task의 GDP 비중</text><text x="660.0" y="42.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#1d1d1f" text-anchor="start">×</text><text x="688.0" y="42.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="400" fill="#0066cc" text-anchor="start">해당 task의 총비용 절감률</text><text x="0.0" y="134.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start">Acemoglu (2024)</text><text x="0.0" y="160.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">GDP 비중 4.6%  ×  절감률 14.4%</text><rect x="330.0" y="118.0" width="300.0" height="26.0" rx="4.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="330.0" y="118.0" width="13.8" height="26.0" rx="4.0" fill="#86868b"/><text x="642.0" y="137.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#86868b" text-anchor="start">4.6%</text><text x="330.0" y="166.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="start">AI가 적용될 task의 GDP 비중</text><line x1="780.0" y1="131.0" x2="826.0" y2="131.0" stroke="#7a7a7a" stroke-width="2" marker-end="url(#ah3)"/><text x="842.0" y="126.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">향후 10년 TFP 이득</text><text x="842.0" y="156.0" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#86868b" text-anchor="start">0.66%</text><text x="932.0" y="156.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">(연 0.07%p)</text><line x1="0.0" y1="208.0" x2="1104.0" y2="208.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="246.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start">Aghion &amp; Bunel (2025) 상한</text><text x="0.0" y="272.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">GDP 비중 54.4%  ×  절감률 22.8%</text><rect x="330.0" y="230.0" width="300.0" height="26.0" rx="4.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="330.0" y="230.0" width="163.2" height="26.0" rx="4.0" fill="#0066cc"/><text x="642.0" y="249.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#0066cc" text-anchor="start">54.4%</text><text x="330.0" y="278.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="start">AI가 적용될 task의 GDP 비중</text><line x1="780.0" y1="243.0" x2="826.0" y2="243.0" stroke="#7a7a7a" stroke-width="2" marker-end="url(#ah3)"/><text x="842.0" y="238.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">향후 10년 TFP 이득</text><text x="842.0" y="268.0" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#0066cc" text-anchor="start">12.4%</text><text x="932.0" y="268.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">(연 1.24%p)</text></g><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">02 · 생산성 효과와 전망</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">09</text></svg>