<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#ffffff"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">THE GAP</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">미시적 효과는 왜</tspan></text><text x="88.0" y="181.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">곧바로 거시로 가지 않는가</tspan></text><rect x="88.0" y="220.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><rect x="88.0" y="264.5" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="273.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">Hulten의 정리: 거시적 효과는 해당 부문의</tspan></text><text x="114.0" y="302.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">비용절감 효과에 그 부문이 경제에서 차지하는</tspan></text><text x="114.0" y="331.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">비중을 곱한 값이다.</tspan></text><rect x="88.0" y="377.5" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="386.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">AI를 쓰는 근로자가 효과를 체감하더라도</tspan></text><text x="114.0" y="415.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">곧바로 기업 산출 증가로 이어지지 않는다.</tspan></text><rect x="88.0" y="461.5" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="470.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">기업 생산성이 올라가도 그것이 GDP 성장의</tspan></text><text x="114.0" y="499.0" font-size="20.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">가속으로 연결된다는 보장은 없다.</tspan></text><g transform="translate(672.0,148.0) scale(1.0000,1.0000)"><defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0066cc"/></marker></defs><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a7a"/></marker></defs><rect x="0.0" y="8.0" width="520.0" height="104.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="0.0" y="8.0" width="4.0" height="104.0" rx="2.0" fill="#0066cc"/><text x="28.0" y="46.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d1d1f" text-anchor="start">업무(task)</text><text x="28.0" y="74.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">AI 적용 업무의 효율 개선</text><text x="492.0" y="46.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="600" fill="#0066cc" text-anchor="end">이미 관측됨</text><line x1="260.0" y1="118.0" x2="260.0" y2="144.0" stroke="#7a7a7a" stroke-width="2" marker-end="url(#ah2)"/><text x="276.0" y="137.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">× 기업 활동에서 차지하는 비중</text><rect x="0.0" y="152.0" width="520.0" height="104.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="0.0" y="152.0" width="4.0" height="104.0" rx="2.0" fill="#333333"/><text x="28.0" y="190.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d1d1f" text-anchor="start">기업(firm)</text><text x="28.0" y="218.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">여러 업무가 결합되어 산출로</text><text x="492.0" y="190.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="600" fill="#333333" text-anchor="end">아직 불분명</text><line x1="260.0" y1="262.0" x2="260.0" y2="288.0" stroke="#7a7a7a" stroke-width="2" marker-end="url(#ah2)"/><text x="276.0" y="281.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a7a7a" text-anchor="start">× 경제 전체에서 차지하는 비중</text><rect x="0.0" y="296.0" width="520.0" height="104.0" rx="18.0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="0.0" y="296.0" width="4.0" height="104.0" rx="2.0" fill="#333333"/><text x="28.0" y="334.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d1d1f" text-anchor="start">경제(GDP)</text><text x="28.0" y="362.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7a7a" text-anchor="start">기업의 성과가 경제 전체로</text><text x="492.0" y="334.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="600" fill="#333333" text-anchor="end">확인되지 않음</text></g><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">01 · 검토배경</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">05</text></svg>