<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#252527"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#2997ff" font-weight="600" font-family="Arial">ELECTRICITY</tspan></text><text x="88.0" y="123.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#ffffff" font-weight="600" font-family="Malgun Gothic, Arial">기계가 아니라 공장을 다시 설계해야 했다</tspan></text><rect x="88.0" y="162.0" width="56.0" height="3.0" rx="0.0" fill="#2997ff"/><text x="88.0" y="206.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">증기기관 자리에 모터만 바꿔 끼웠을 때는 효율 우위가 분명하지 않았다. 동력축을 걷어내고</tspan></text><text x="88.0" y="234.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">기계마다 모터를 달고 나서야 속도 조절과 동선 재배치가 가능해졌다.</tspan></text><g transform="translate(88.0,275.0) scale(1.0000,1.0000)"><defs><marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2997ff"/></marker></defs><text x="0.0" y="22.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">① 기존 방식 — 중앙 동력 + 천장 동력축</text><text x="0.0" y="46.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#cccccc" text-anchor="start">동력축 하나에 모든 기계가 물려 있어 배치와 속도를 바꿀 수 없음</text><rect x="0.0" y="70.0" width="420.0" height="180.0" rx="11.0" fill="#2a2a2c" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><rect x="18.0" y="150.0" width="70.0" height="76.0" rx="5.0" fill="#2997ff"/><text x="53.0" y="194.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="600" fill="#101013" text-anchor="middle">엔진</text><line x1="18.0" y1="108.0" x2="402.0" y2="108.0" stroke="#8a8a90" stroke-width="5"/><text x="402.0" y="98.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="12" font-weight="400" fill="#cccccc" text-anchor="end">동력축(shaft)</text><line x1="116.0" y1="108.0" x2="116.0" y2="176.0" stroke="#6a6a70" stroke-width="2"/><rect x="96.0" y="176.0" width="40.0" height="50.0" rx="5.0" fill="#3a3a3e" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><line x1="176.0" y1="108.0" x2="176.0" y2="176.0" stroke="#6a6a70" stroke-width="2"/><rect x="156.0" y="176.0" width="40.0" height="50.0" rx="5.0" fill="#3a3a3e" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><line x1="236.0" y1="108.0" x2="236.0" y2="176.0" stroke="#6a6a70" stroke-width="2"/><rect x="216.0" y="176.0" width="40.0" height="50.0" rx="5.0" fill="#3a3a3e" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><line x1="296.0" y1="108.0" x2="296.0" y2="176.0" stroke="#6a6a70" stroke-width="2"/><rect x="276.0" y="176.0" width="40.0" height="50.0" rx="5.0" fill="#3a3a3e" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><line x1="356.0" y1="108.0" x2="356.0" y2="176.0" stroke="#6a6a70" stroke-width="2"/><rect x="336.0" y="176.0" width="40.0" height="50.0" rx="5.0" fill="#3a3a3e" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><line x1="88.0" y1="188.0" x2="116.0" y2="188.0" stroke="#8a8a90" stroke-width="3"/><line x1="460.0" y1="160" x2="580.0" y2="160" stroke="#2997ff" stroke-width="2.5" marker-end="url(#ah4)"/><text x="520.0" y="140.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" font-weight="600" fill="#2997ff" text-anchor="middle">분산형 동력</text><text x="520.0" y="186.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#cccccc" text-anchor="middle">동력축 제거</text><text x="620.0" y="22.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">② 재조직 이후 — 기계마다 개별 모터</text><text x="620.0" y="46.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#cccccc" text-anchor="start">속도를 따로 조절하고 작업 동선에 맞춰 재배치할 수 있게 됨</text><rect x="620.0" y="70.0" width="420.0" height="180.0" rx="11.0" fill="#2a2a2c" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><rect x="644.0" y="118.0" width="44.0" height="54.0" rx="5.0" fill="#3a3a3e" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><circle cx="666.0" cy="104.0" r="9" fill="#2997ff"/><rect x="710.0" y="158.0" width="44.0" height="54.0" rx="5.0" fill="#3a3a3e" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><circle cx="732.0" cy="144.0" r="9" fill="#2997ff"/><rect x="776.0" y="118.0" width="44.0" height="54.0" rx="5.0" fill="#3a3a3e" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><circle cx="798.0" cy="104.0" r="9" fill="#2997ff"/><rect x="842.0" y="158.0" width="44.0" height="54.0" rx="5.0" fill="#3a3a3e" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><circle cx="864.0" cy="144.0" r="9" fill="#2997ff"/><rect x="908.0" y="118.0" width="44.0" height="54.0" rx="5.0" fill="#3a3a3e" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><circle cx="930.0" cy="104.0" r="9" fill="#2997ff"/><text x="830.0" y="238.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#cccccc" text-anchor="middle">천장을 가로지르는 동력축이 사라짐</text></g><text x="88.0" y="615.4" font-size="18.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">전기가 공장의 주된 동력원이 되기까지 </tspan><tspan fill="#2997ff" font-weight="600" font-family="Malgun Gothic, Arial">30년 이상</tspan><tspan fill="#cccccc" font-weight="400" font-family="Malgun Gothic, Arial">이 걸렸다 (Devine, 1983).</tspan></text><line x1="0" y1="664" x2="1280" y2="664" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#cccccc">03 · 범용기술 확산의 역사</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#ffffff" text-anchor="end">15</text></svg>