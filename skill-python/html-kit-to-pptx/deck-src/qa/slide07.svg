<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#ffffff"/><text x="88.0" y="75.2" font-size="14.0" text-anchor="start" letter-spacing="1.60"><tspan fill="#0066cc" font-weight="600" font-family="Arial">TASK LEVEL</tspan></text><text x="88.0" y="129.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">업무 수준에서는</tspan></text><text x="88.0" y="181.2" font-size="44.0" text-anchor="start" letter-spacing="-1.00"><tspan fill="#1d1d1f" font-weight="600" font-family="Malgun Gothic, Arial">효과가 이미 나타났다</tspan></text><rect x="88.0" y="220.0" width="56.0" height="3.0" rx="0.0" fill="#0066cc"/><rect x="88.0" y="259.9" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="268.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">고객지원에 AI 에이전트를 도입하자 시간당</tspan></text><text x="114.0" y="296.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">문의 해결 건수가 23.9% 증가했고, 그 효과는</tspan></text><text x="114.0" y="324.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">도입 3개월째에 정점에 이르렀다.</tspan></text><rect x="88.0" y="367.9" width="7.0" height="7.0" rx="3.5" fill="#0066cc"/><text x="114.0" y="376.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">국내 취업자 5,512명 설문에서는 업무시간이</tspan></text><text x="114.0" y="404.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">약 3.8% 단축되는 데 그쳤다 — 통제된 실험이</tspan></text><text x="114.0" y="432.2" font-size="19.0" text-anchor="start" letter-spacing="0.00"><tspan fill="#1d1d1f" font-weight="400" font-family="Malgun Gothic, Arial">아닌 실제 업무환경의 값이다.</tspan></text><g transform="translate(632.0,176.0) scale(1.0000,1.0000)"><line x1="168.0" y1="44.0" x2="168.0" y2="322.0" stroke="#e0e0e0" stroke-width="1"/><text x="168.0" y="342.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">0%</text><line x1="278.7" y1="44.0" x2="278.7" y2="322.0" stroke="#e0e0e0" stroke-width="1"/><text x="278.7" y="342.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">20%</text><line x1="389.3" y1="44.0" x2="389.3" y2="322.0" stroke="#e0e0e0" stroke-width="1"/><text x="389.3" y="342.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">40%</text><line x1="500.0" y1="44.0" x2="500.0" y2="322.0" stroke="#e0e0e0" stroke-width="1"/><text x="500.0" y="342.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="middle">60%</text><rect x="168.0" y="54.0" width="308.8" height="34.0" rx="4.0" fill="#0066cc"/><text x="488.8" y="78.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start">55.8%</text><text x="152.0" y="70.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="end">코딩 속도</text><text x="152.0" y="88.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="end">Peng et al.(2023)</text><rect x="168.0" y="130.0" width="221.3" height="34.0" rx="4.0" fill="#0066cc"/><text x="401.3" y="154.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start">40.0%</text><text x="152.0" y="146.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="end">글쓰기 과제</text><text x="152.0" y="164.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="end">Noy &amp; Zhang(2023)</text><rect x="168.0" y="206.0" width="132.2" height="34.0" rx="4.0" fill="#0066cc"/><text x="312.2" y="230.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start">23.9%</text><text x="152.0" y="222.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="end">고객상담 해결건수</text><text x="152.0" y="240.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="end">Brynjolfsson et al.(2025)</text><rect x="168.0" y="282.0" width="21.0" height="34.0" rx="4.0" fill="#86868b"/><text x="201.0" y="306.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start">3.8%</text><text x="152.0" y="298.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="end">업무시간 단축</text><text x="152.0" y="316.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7a7a" text-anchor="end">서동현 외(2026), 설문</text><rect x="168.0" y="8.0" width="11.0" height="11.0" rx="2.0" fill="#0066cc"/><text x="186.0" y="18.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">통제된 실험 환경</text><rect x="328.0" y="8.0" width="11.0" height="11.0" rx="2.0" fill="#86868b"/><text x="346.0" y="18.0" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">실제 업무환경 설문</text></g><line x1="0" y1="664" x2="1280" y2="664" stroke="#e0e0e0" stroke-width="1"/><text x="88" y="698" font-size="13" font-family="Malgun Gothic, Arial" fill="#7a7a7a">02 · 생산성 효과와 전망</text><text x="1192" y="698" font-size="13" font-family="Arial" font-weight="600" fill="#333333" text-anchor="end">07</text></svg>